# Mosquitto 2.x broker for the Smart Tactical Armor ops room.
# Run:  mosquitto -c mosquitto.conf -v
# Use absolute paths below on your machine.

# Vests (MQTT over TCP) — lab / demo network
listener 1883
protocol mqtt

# Dashboard in a browser (MQTT over WebSockets)
listener 9001
protocol websockets

allow_anonymous false
password_file /path/to/ops_room/passwd
acl_file      /path/to/ops_room/acl

# Field setup: TLS on 8883 (set MQTT_USE_TLS 1 in config.h)
#listener 8883
#protocol mqtt
#cafile   /path/to/certs/ca.crt
#certfile /path/to/certs/server.crt
#keyfile  /path/to/certs/server.key
#tls_version tlsv1.2
